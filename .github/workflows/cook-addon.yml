name: Cook addon

# The path tracer tests skip when the native addon is not built, so the required `test` check goes green without running them (#1146).
# This job builds the addon from the pinned @codepawlhq/cook with a cached cargo target, runs those tests on a software Vulkan
# adapter (lavapipe) and writes what ran and what was skipped to the job summary. It is not required by branch protection and
# not part of the `test` job's needs, so a slow cold build never holds a merge.
# The job runs for a pull request only when it touches native code: package.json, the lock file, a file the addon tests reach
# through their imports (traced by scripts/addon-job-paths.mjs, kept in step by tests/addon-job-paths.test.js) or this workflow.
# Every other pull request skips it, and main runs it nightly (#1796).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/summarize-addon-tests.mjs'
      - 'scripts/agent-memory-guard.mjs'
      - 'scripts/check-first-native-job.mjs'
      - 'scripts/addon-job-paths.mjs'
      - 'scripts/import-specifiers.mjs'
      - 'scripts/cook-addon-cache-key.mjs'
      - 'tests/cook-addon-cache-key.test.js'
      - 'tests/addon-job-paths.test.js'
      - 'scripts/build-mcp.mjs'
      - '.github/workflows/cook-addon.yml'
      - 'bench/cycles-parity/cook-only-fields.mjs'
      - 'bench/cycles-parity/export-scene.mjs'
      - 'bench/cycles-parity/grey-diffuse-override.mjs'
      - 'bench/cycles-parity/instanced-scene.mjs'
