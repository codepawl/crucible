  push:
    branches: [main]
    paths:
      - 'package-lock.json'
      - '.github/workflows/cook-addon.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cook-addon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  addon:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Tests failed on Intel and AMD runners with AVX2 and AVX-512 and passed on others (#1760). lavapipe's JIT gives a different
      # result for the Cook kernel on a CPU with AVX2 (a magnified mip read off by 8 to 80, the albedo sum 0.9 percent low, the light
      # tree mean 0.7044 against 0.6905), and the same kernel is right with LLVM's optimisation passes off and right when the JIT
      # is held to AVX. Limit lavapipe to AVX so every runner compiles the kernel the same way (cook#42 found it first on the flat
      # light pick). On Xeon 6975P-C and EPYC 9V45, GALLIUM_OVERRIDE_CPU_CAPS=avx passed all 74 tests of the seven files that
      # failed in the default JIT, and GALLIUM_OVERRIDE_CPU_CAPS=avx2 failed the same two tests as the default. Drop this once
      # Mesa's LLVM stops doing that.
      GALLIUM_OVERRIDE_CPU_CAPS: avx
      LP_NATIVE_VECTOR_WIDTH: '256'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The built addon is cached by the Cook pin, the runner and the Rust toolchain (#1800). A hit skips the cargo target restore
      # and the cargo build; a miss builds as before and saves the addon. Fork pull requests may restore but never save, so a fork
      # cannot plant an addon that a later run on this repository would load.
      - name: Work out the addon cache key
        id: addon-key
        run: |
          rustc_line=$(cd node_modules/@codepawlhq/cook && rustc --version)
          node scripts/cook-addon-cache-key.mjs "$RUNNER_OS" "$RUNNER_ARCH" "$rustc_line" | tee -a "$GITHUB_OUTPUT"
      - name: Restore the built Cook addon
        id: addon-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@codepawlhq/cook/build
          key: ${{ steps.addon-key.outputs.key }}
      # Cached by the cargo.lock of the installed Cook, so a Cook bump rebuilds and every other miss reuses the target folder.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.addon-cache.outputs.cache-hit != 'true'
        with:
          workspaces: node_modules/@codepawlhq/cook
          cache-on-failure: true
      - name: Build the Cook addon
        if: steps.addon-cache.outputs.cache-hit != 'true'
        run: |
          start=$(date +%s)
          npm run cook:build
          build_seconds=$(( $(date +%s) - start ))
          echo "$build_seconds" > node_modules/@codepawlhq/cook/build/build-seconds.txt
          echo "build_seconds=$build_seconds" >> "$GITHUB_ENV"
          echo "addon_source=built from the pin, cache miss" >> "$GITHUB_ENV"
      - name: Save the built Cook addon
        if: steps.addon-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@codepawlhq/cook/build
          key: ${{ steps.addon-key.outputs.key }}
      - name: Report that the Cook addon came from the cache
        if: steps.addon-cache.outputs.cache-hit == 'true'
        run: |
          recorded=$(cat node_modules/@codepawlhq/cook/build/build-seconds.txt 2>/dev/null || echo '?')
          echo "build_seconds=0" >> "$GITHUB_ENV"
          echo "addon_source=restored from the cache, cargo skipped, saved about ${recorded} s (the build time recorded when it was cached)" >> "$GITHUB_ENV"
      - name: Install lavapipe and report what it supports
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools ffmpeg
          {
            echo '### Vulkan adapter'
            echo '```'
            grep -m1 'model name' /proc/cpuinfo || true
            echo "avx2: $(grep -o -m1 avx2 /proc/cpuinfo | head -1 | grep . || echo no), avx512f: $(grep -o -m1 avx512f /proc/cpuinfo | head -1 | grep . || echo no), GALLIUM_OVERRIDE_CPU_CAPS=$GALLIUM_OVERRIDE_CPU_CAPS, LP_NATIVE_VECTOR_WIDTH=$LP_NATIVE_VECTOR_WIDTH"
            vulkaninfo --summary 2>&1 | grep -E 'deviceName|driverInfo|apiVersion|deviceType' || true
            echo
            vulkaninfo 2>&1 | grep -E 'VK_KHR_(ray_query|acceleration_structure)' | sort -u || echo 'no VK_KHR_ray_query or VK_KHR_acceleration_structure'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # A fresh runner has an empty Mesa shader cache, so the first native job compiles the kernel cold on lavapipe. That job
      # once failed the memory guard (#1186); this step runs it first, with the cache off, and fails the job if it does not
      # complete on the native backend.
      - name: First native render job on a fresh runner completes under the memory guard
        env:
          MESA_SHADER_CACHE_DISABLE: 'true'
          PROBE_FRAMES: '12'
          PROBE_MAX_SECONDS: '600'
          PROBE_RUNTIME_BACKEND: cpu
        run: |
          npm run build
          node scripts/build-mcp.mjs
          node scripts/check-first-native-job.mjs . 960x540
      - name: Run the addon tests
        run: |
          start=$(date +%s)
          # The summary step decides pass or fail: tests that lose the device on lavapipe are counted apart.
          # Two test files at a time: lavapipe JIT-compiles the Cook kernel in every process (one peaked at 3.2 GB of RSS, #1186),
          # and with the default concurrency the light-tree file crashed (SIGSEGV) and byte-for-byte tests differed, while each
          # passed alone and two runs of one render were byte-identical on lavapipe (#1717).
          set +e
          test_options="--test-concurrency=2 --import ./scripts/test-hang-guard.mjs --test-timeout=300000 --test-reporter=tap"
          node --test $test_options --test-reporter-destination=addon-tests.tap $(git grep -l "support/cook.js" -- tests)
          status=$?
          echo "test_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "node --test exit code $status"
      - name: Write ran and skipped counts to the job summary, fail on a real failure
        run: |
          set +e
          node scripts/summarize-addon-tests.mjs addon-tests.tap --title 'Tests that load Cook, addon built, lavapipe adapter' \n            --gpu-bound 'a process that rendered with the native addon exits with code 0' > summary.md
          status=$?
          echo "Cook addon: ${addon_source:-unknown}. Cargo build ${build_seconds:-?} s, tests ${test_seconds:-?} s." >> summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: addon-tests-tap
          path: addon-tests.tap
          if-no-files-found: ignore
