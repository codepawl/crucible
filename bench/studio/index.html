<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17161a" />
    <meta name="description" content="Development page for the Crucible Studio addon." />
    <title>Crucible Studio</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The tokens come from a stylesheet link, which blocks the first paint, so the page never shows the browser's white. -->
    <link rel="stylesheet" href="../../src/site-tokens.css" />
    <!-- A saved Light or Dark theme is on the root before anything paints. System follows the colour scheme. The key is STUDIO_PREFERENCES_KEY. -->
    <script>
      try {
        var savedTheme = JSON.parse(localStorage.getItem('crucible-studio-preferences')).theme;
        if (savedTheme === 'dark' || savedTheme === 'light') {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {}
    </script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--site-bg);
        color: var(--site-text);
        font-family: Inter, system-ui, sans-serif;
      }
      #studio-root {
        display: block;
        width: 100%;
        height: 100svh;
        min-height: 480px;
      }
      #studio-loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 28px;
      }
      body:has(#studio-loading)::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9;
        background: var(--site-bg);
      }
      #studio-loading .pour {
        position: relative;
        width: 120px;
        height: 96px;
        /* The tipped pot is drawn from x = -59 to the bar end at 120, so the drawn group's middle sits at x = 30, 30 px left of
           the box middle. The shift is that 30 px times the scale, which puts what the eye sees in the middle of the window. */
        transform: translateX(33px) scale(1.1);
      }
      #studio-loading .pot {
        position: absolute;
        left: -78px;
        width: 72px;
        height: 72px;
        transform-origin: 85% 88%;
      }
      #studio-loading .mark {
        width: 72px;
        height: 72px;
      }
      #studio-loading .mark-dark {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #studio-loading .mark-light { display: none; }
        :root:not([data-theme="light"]) #studio-loading .mark-dark { display: block; }
      }
      [data-theme="dark"] #studio-loading .mark-light { display: none; }
      [data-theme="dark"] #studio-loading .mark-dark { display: block; }
      #studio-loading .stream {
        position: absolute;
        left: 2px;
        top: 24px;
        width: 16px;
        height: 70px;
        z-index: 0;
        opacity: 0;
        transform-origin: 6px 0;
      }
      #studio-loading .flow {
        position: absolute;
        inset: 0;
        transform-origin: 6px 0;
        clip-path: path("M1 0H8C10 6 9.5 14 8 24C7.5 36 8 52 8 70H4C4 52 3.6 36 3.2 24C2.6 12 1 8 1 0Z");
      }
      #studio-loading .flow i {
        position: absolute;
        inset: -14px 0 0;
        background:
          repeating-linear-gradient(transparent 0, color-mix(in srgb, var(--site-text) 24%, transparent) 4px, transparent 8px, color-mix(in srgb, var(--site-bg) 30%, transparent) 11px, transparent 14px),
          var(--site-focus);
      }
      #studio-loading .flow::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        height: 14px;
        background: linear-gradient(transparent, var(--site-focus));
      }
      #studio-loading .spark {
        position: absolute;
        left: 7px;
        top: 91px;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: var(--site-focus);
        opacity: 0;
        z-index: 3;
        visibility: visible;
        transition: visibility 0s linear 0.09s;
      }
      #studio-loading .progress {
        z-index: 2;
        position: absolute;
        left: 6px;
        top: 92px;
        width: 114px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: color-mix(in srgb, var(--site-text) 40%, transparent);
      }
      #studio-loading .fill {
        height: 100%;
        background: var(--site-focus);
        transform: scaleX(var(--progress, 0.04));
        transform-origin: 0 50%;
        animation: studio-fill-creep 150s linear both;
      }
      #studio-loading[data-state="done"] { animation: studio-loader-fade 0.15s ease-out 0.15s both; pointer-events: none; }
      @media (prefers-reduced-motion: no-preference) {
        #studio-loading[data-state="done"] { animation-delay: 0.27s; animation-duration: 0.1s; }
        #studio-loading .fill { animation: studio-fill-creep 150s linear both, studio-fill-land 0.08s steps(1, end) 0.72s both; }
        #studio-loading .pot { animation: studio-pot-tilt 0.6s var(--site-ease-out) both; }
        #studio-loading .stream { animation: studio-stream-in 0.35s var(--site-ease-out) 0.45s both; }
        #studio-loading .flow { animation: studio-stream-sway 2.2s ease-in-out infinite alternate; }
        #studio-loading .flow i { animation: studio-stream-flow 0.7s linear infinite; }
        #studio-loading .spark { animation: studio-spark 1.3s linear infinite; }
        #studio-loading .spark:nth-of-type(1) { --dx: -8px; --rise: 9px; animation-delay: 0.9s; }
        #studio-loading .spark:nth-of-type(2) { --dx: 7px; --rise: 7px; animation-duration: 1.7s; animation-delay: 1.15s; }
        #studio-loading .spark:nth-of-type(3) { --dx: -4px; --rise: 6px; animation-duration: 1.9s; animation-delay: 1.5s; }
        #studio-loading .spark:nth-of-type(4) { --dx: 10px; --rise: 8px; animation-duration: 1.1s; animation-delay: 1.8s; }
        #studio-loading[data-state="done"] .pot { animation: studio-pot-right 0.1s var(--site-ease-out) 0.17s both; }
        #studio-loading[data-state="done"] .stream { animation: studio-stream-out 0.08s ease-in 0.09s both; }
        #studio-loading[data-state="done"] .spark { visibility: hidden; }
      }
      @keyframes studio-fill-creep { 0% { transform: scaleX(0.04); animation-timing-function: cubic-bezier(0.1, 0.5, 0.2, 1); } 20% { transform: scaleX(0.3); } 100% { transform: scaleX(0.34); } }
      @keyframes studio-pot-tilt { from { transform: rotate(0); } to { transform: rotate(30deg); } }
      @keyframes studio-pot-right { from { transform: rotate(30deg); } to { transform: rotate(0); } }
      @keyframes studio-fill-land { from { opacity: 0; } to { opacity: 1; } }
      @keyframes studio-stream-in { from { opacity: 0; transform: scaleY(0); } to { opacity: 1; transform: scaleY(1); } }
      @keyframes studio-stream-out { from { opacity: 1; transform: scaleY(1); } 80% { opacity: 0; } to { opacity: 0; transform: scaleY(0); } }
      @keyframes studio-stream-flow { to { transform: translateY(14px); } }
      @keyframes studio-stream-sway { from { transform: scaleX(0.97); } to { transform: scaleX(1.03); } }
      @keyframes studio-spark { 0% { opacity: 1; transform: none; animation-timing-function: ease-out; } 11% { opacity: 1; transform: translate(calc(var(--dx) * 0.6), calc(var(--rise) * -1)); animation-timing-function: ease-in; } 21% { opacity: 0; transform: translate(var(--dx), 2px); } 100% { opacity: 0; transform: translate(var(--dx), 2px); } }
      @keyframes studio-loader-fade { from { opacity: 1; } to { opacity: 0; } }
      #studio-loading .failure {
        display: none;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 10px;
        max-width: min(520px, 86vw);
        color: var(--site-text);
        font-size: 14px;
        line-height: 1.4;
      }
      #studio-loading .failure svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: var(--site-focus);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #studio-loading[data-state="error"] .pour { transform: none; width: 72px; }
      #studio-loading[data-state="error"] .pot { left: 0; animation: none; }
      #studio-loading[data-state="error"] :is(.stream, .spark, .progress) { display: none; }
      #studio-loading[data-state="error"] .failure { display: grid; }
    </style>
  </head>
  <body>
    <main id="studio-root"></main>
    <div id="studio-loading" role="status" aria-label="Loading Studio">
      <div class="pour">
        <div class="stream"><div class="flow"><i></i></div></div>
        <div class="pot">
          <img class="mark mark-light" src="/brand/crucible-mark.svg" alt="" fetchpriority="high" />
          <img class="mark mark-dark" src="/brand/crucible-mark-dark.svg" alt="" loading="lazy" />
        </div>
        <div class="progress"><div class="fill"></div></div>
        <i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i>
      </div>
      <div class="failure" role="alert">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
        <span data-loading-message></span>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
